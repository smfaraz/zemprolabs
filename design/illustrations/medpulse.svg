<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <filter id="sh" x="-60%" y="-60%" width="220%" height="260%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dy="22"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#EADCC8"/>
    </pattern>
    <pattern id="mapdots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="3.2" fill="#4A2C55"/>
    </pattern>
    <clipPath id="ecg"><rect x="700" y="110" width="790" height="380" rx="22"/></clipPath>
  </defs>

  <rect width="1600" height="1000" fill="#FBF4EA"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>
  <circle cx="140" cy="900" r="220" fill="#F4EADD"/>

  <g font-family="'Segoe UI', Arial, sans-serif">
    <!-- Feed column -->
    <text x="110" y="140" font-size="20" fill="#7B6A66" letter-spacing="2">GCC HEALTH FEED</text>
    <rect x="510" y="118" width="130" height="32" rx="16" fill="#2A1B30"/>
    <circle cx="534" cy="134" r="6" fill="#FFB33F"/>
    <text x="548" y="141" font-size="16" fill="#FBF4EA">Auto-sync</text>

    <g filter="url(#sh)"><rect x="110" y="180" width="530" height="190" rx="18" fill="#FFFFFF"/></g>
    <rect x="140" y="210" width="118" height="30" rx="15" fill="#F2464B"/>
    <text x="199" y="231" font-size="15" text-anchor="middle" fill="#FBF4EA">Advisory</text>
    <text x="600" y="231" font-size="15" text-anchor="end" fill="#9A8783">2 min ago</text>
    <rect x="140" y="262" width="420" height="16" rx="8" fill="#1A1218"/>
    <rect x="140" y="290" width="340" height="16" rx="8" fill="#1A1218"/>
    <rect x="140" y="326" width="460" height="10" rx="5" fill="#E3D2C0"/>
    <rect x="140" y="344" width="300" height="10" rx="5" fill="#E3D2C0"/>

    <g filter="url(#sh)"><rect x="110" y="400" width="530" height="170" rx="18" fill="#FFFFFF"/></g>
    <rect x="140" y="430" width="128" height="30" rx="15" fill="#F4EADD"/>
    <text x="204" y="451" font-size="15" text-anchor="middle" fill="#2A1B30">Cardiology</text>
    <text x="600" y="451" font-size="15" text-anchor="end" fill="#9A8783">18 min ago</text>
    <rect x="140" y="482" width="440" height="16" rx="8" fill="#1A1218"/>
    <rect x="140" y="518" width="420" height="10" rx="5" fill="#E3D2C0"/>
    <rect x="140" y="536" width="260" height="10" rx="5" fill="#E3D2C0"/>

    <g filter="url(#sh)"><rect x="110" y="600" width="530" height="170" rx="18" fill="#FFFFFF"/></g>
    <rect x="140" y="630" width="140" height="30" rx="15" fill="#F4EADD"/>
    <text x="210" y="651" font-size="15" text-anchor="middle" fill="#2A1B30">Public health</text>
    <text x="600" y="651" font-size="15" text-anchor="end" fill="#9A8783">1 h ago</text>
    <rect x="140" y="682" width="380" height="16" rx="8" fill="#1A1218"/>
    <rect x="140" y="718" width="440" height="10" rx="5" fill="#E3D2C0"/>
    <rect x="140" y="736" width="220" height="10" rx="5" fill="#E3D2C0"/>

    <g opacity="0.55"><rect x="110" y="800" width="530" height="110" rx="18" fill="#FFFFFF"/>
    <rect x="140" y="830" width="110" height="30" rx="15" fill="#F4EADD"/>
    <rect x="140" y="878" width="320" height="14" rx="7" fill="#E3D2C0"/></g>

    <!-- Live signal panel -->
    <g filter="url(#sh)"><rect x="700" y="110" width="790" height="380" rx="22" fill="#2A1B30"/></g>
    <g clip-path="url(#ecg)">
      <g stroke="#4A2C55" stroke-width="1">
        <line x1="700" y1="250" x2="1490" y2="250"/><line x1="700" y1="330" x2="1490" y2="330"/><line x1="700" y1="410" x2="1490" y2="410"/>
        <line x1="860" y1="110" x2="860" y2="490"/><line x1="1020" y1="110" x2="1020" y2="490"/><line x1="1180" y1="110" x2="1180" y2="490"/><line x1="1340" y1="110" x2="1340" y2="490"/>
      </g>
      <path d="M700 340 H860 L885 340 L900 300 L918 380 L940 210 L962 430 L982 320 L1000 340 H1150 L1170 340 L1185 305 L1200 372 L1222 230 L1244 418 L1262 326 L1280 340 H1490"
        fill="none" stroke="#FFB33F" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="1262" cy="326" r="10" fill="#FBF4EA"/>
      <circle cx="1262" cy="326" r="22" fill="none" stroke="#FBF4EA" stroke-opacity="0.35" stroke-width="3"/>
    </g>
    <text x="740" y="168" font-size="20" fill="#D7A6C2" letter-spacing="2">CLINICAL SIGNALS</text>
    <text x="740" y="458" font-size="16" fill="#D7A6C2">Publications ingested, checked and categorised</text>
    <rect x="1330" y="146" width="120" height="32" rx="16" fill="#F2464B"/>
    <text x="1390" y="168" font-size="16" text-anchor="middle" fill="#FBF4EA">Updating</text>

    <!-- Region panel -->
    <g filter="url(#sh)"><rect x="700" y="530" width="460" height="380" rx="22" fill="#150E16"/></g>
    <text x="740" y="588" font-size="20" fill="#D7A6C2" letter-spacing="2">REGION</text>
    <!-- Stylised Arabian peninsula from dots -->
    <path d="M800 640 L900 625 L980 650 L1040 700 L1100 760 L1110 800 L1060 850 L960 870 L900 840 L860 780 L820 720 Z" fill="url(#mapdots)"/>
    <g fill="#FFB33F">
      <circle cx="1060" cy="745" r="9"/><circle cx="1000" cy="700" r="9"/><circle cx="930" cy="790" r="9"/><circle cx="1080" cy="800" r="9"/>
    </g>
    <circle cx="1060" cy="745" r="22" fill="none" stroke="#FFB33F" stroke-width="2.5" opacity="0.6"/>
    <text x="1080" y="730" font-size="15" fill="#FBF4EA">UAE</text>
    <text x="938" y="830" font-size="15" fill="#D7A6C2">KSA</text>

    <!-- Topic filters -->
    <g filter="url(#sh)"><rect x="1190" y="530" width="300" height="380" rx="22" fill="#F4EADD"/></g>
    <text x="1222" y="588" font-size="20" fill="#7B6A66" letter-spacing="2">TOPICS</text>
    <rect x="1222" y="616" width="236" height="44" rx="12" fill="#2A1B30"/>
    <text x="1244" y="645" font-size="17" fill="#FBF4EA">Infectious disease</text>
    <rect x="1222" y="672" width="236" height="44" rx="12" fill="#FBF4EA"/>
    <text x="1244" y="701" font-size="17" fill="#1A1218">Cardiology</text>
    <rect x="1222" y="728" width="236" height="44" rx="12" fill="#FBF4EA"/>
    <text x="1244" y="757" font-size="17" fill="#1A1218">Oncology</text>
    <rect x="1222" y="784" width="236" height="44" rx="12" fill="#FBF4EA"/>
    <text x="1244" y="813" font-size="17" fill="#1A1218">Regulation</text>
    <rect x="1222" y="848" width="140" height="10" rx="5" fill="#E3D2C0"/>
  </g>
</svg>
