<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <filter id="sh" x="-60%" y="-60%" width="220%" height="260%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="24"/>
      <feOffset dy="24"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#24172A" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="#150E16"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <circle cx="1350" cy="140" r="300" fill="#2A1B30" opacity="0.6"/>

  <g font-family="'Segoe UI', Arial, sans-serif">
    <!-- Workflow panel -->
    <g filter="url(#sh)"><rect x="110" y="110" width="900" height="420" rx="22" fill="#2A1B30"/></g>
    <text x="150" y="168" font-size="20" fill="#D7A6C2" letter-spacing="2">WORKFLOW · CHANGE REQUEST</text>
    <rect x="860" y="146" width="110" height="32" rx="16" fill="#4A2C55"/>
    <circle cx="884" cy="162" r="6" fill="#FFB33F"/>
    <text x="898" y="169" font-size="17" fill="#FBF4EA">Live</text>

    <!-- connectors -->
    <path d="M300 330 C 360 330, 360 260, 420 260" stroke="#F2464B" stroke-width="4" fill="none"/>
    <path d="M300 330 C 360 330, 360 400, 420 400" stroke="#4A2C55" stroke-width="4" fill="none"/>
    <path d="M600 260 C 650 260, 650 330, 700 330" stroke="#F2464B" stroke-width="4" fill="none"/>
    <path d="M600 400 C 650 400, 650 330, 700 330" stroke="#4A2C55" stroke-width="4" fill="none"/>
    <circle cx="420" cy="260" r="7" fill="#F2464B"/>
    <circle cx="700" cy="330" r="7" fill="#F2464B"/>

    <!-- nodes -->
    <rect x="150" y="290" width="150" height="80" rx="16" fill="#150E16" stroke="#4A2C55" stroke-width="2"/>
    <circle cx="182" cy="330" r="14" fill="#FFB33F"/>
    <text x="206" y="338" font-size="21" fill="#FBF4EA">Incident</text>

    <rect x="420" y="220" width="180" height="80" rx="16" fill="#F2464B"/>
    <text x="450" y="268" font-size="21" fill="#FBF4EA">Triage &amp; route</text>

    <rect x="420" y="360" width="180" height="80" rx="16" fill="#150E16" stroke="#4A2C55" stroke-width="2"/>
    <text x="452" y="408" font-size="21" fill="#D7A6C2">Risk check</text>

    <rect x="700" y="290" width="260" height="80" rx="16" fill="#FBF4EA"/>
    <circle cx="734" cy="330" r="14" fill="#2A1B30"/>
    <path d="M727 330 l5 6 l10 -12" stroke="#FBF4EA" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="760" y="338" font-size="21" fill="#1A1218">Approved release</text>

    <text x="150" y="480" font-size="17" fill="#8F7486">Flow Designer · ITSM · IRM / GRC</text>

