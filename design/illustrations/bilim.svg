<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <filter id="sh" x="-60%" y="-60%" width="220%" height="260%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="24"/><feOffset dy="24"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 H0 V40" fill="none" stroke="#24172A" stroke-width="1"/></pattern>
  </defs>
  <rect width="1600" height="1000" fill="#150E16"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <circle cx="200" cy="880" r="280" fill="#2A1B30" opacity="0.6"/>

  <g font-family="'Segoe UI', Arial, sans-serif">
    <!-- connectors -->
    <g stroke="#F2464B" stroke-width="4" fill="none">
      <path d="M560 320 C 640 320, 640 500, 720 500"/>
      <path d="M880 500 C 960 500, 960 300, 1040 300"/>
      <path d="M880 500 C 960 500, 960 500, 1040 500"/>
      <path d="M880 500 C 960 500, 960 700, 1040 700"/>
    </g>
    <path d="M560 680 C 640 680, 640 500, 720 500" stroke="#4A2C55" stroke-width="4" fill="none"/>
    <g fill="#F2464B"><circle cx="720" cy="500" r="8"/><circle cx="1040" cy="300" r="8"/><circle cx="1040" cy="500" r="8"/><circle cx="1040" cy="700" r="8"/></g>

    <!-- Storefront card -->
    <g filter="url(#sh)"><rect x="110" y="200" width="450" height="240" rx="20" fill="#FBF4EA"/></g>
    <text x="146" y="252" font-size="18" fill="#7B6A66" letter-spacing="2">STOREFRONT</text>
    <rect x="146" y="276" width="170" height="130" rx="12" fill="#2A1B30"/>
    <circle cx="231" cy="341" r="34" fill="#F2464B"/>
    <rect x="336" y="282" width="190" height="14" rx="7" fill="#1A1218"/>
    <rect x="336" y="306" width="140" height="10" rx="5" fill="#CDB9A8"/>
    <rect x="336" y="364" width="120" height="38" rx="19" fill="#1A1218"/>
    <text x="396" y="389" font-size="15" text-anchor="middle" fill="#FBF4EA">Add to bag</text>

    <!-- Admin card -->
    <g filter="url(#sh)"><rect x="110" y="560" width="450" height="240" rx="20" fill="#2A1B30"/></g>
    <text x="146" y="612" font-size="18" fill="#D7A6C2" letter-spacing="2">ADMIN</text>
    <g>
      <rect x="146" y="636" width="378" height="40" rx="10" fill="#150E16"/><rect x="164" y="651" width="160" height="10" rx="5" fill="#D7A6C2"/>
      <rect x="146" y="688" width="378" height="40" rx="10" fill="#150E16"/><rect x="164" y="703" width="200" height="10" rx="5" fill="#D7A6C2"/>
      <rect x="146" y="740" width="378" height="40" rx="10" fill="#150E16"/><rect x="164" y="755" width="130" height="10" rx="5" fill="#D7A6C2"/>
    </g>

    <!-- Core engine -->
    <g filter="url(#sh)"><rect x="720" y="400" width="160" height="200" rx="24" fill="#F2464B"/></g>
    <rect x="752" y="440" width="96" height="16" rx="8" fill="#FBF4EA" opacity="0.9"/>
    <rect x="752" y="468" width="70" height="12" rx="6" fill="#FBF4EA" opacity="0.5"/>
    <text x="800" y="540" font-size="20" text-anchor="middle" fill="#FBF4EA">Commerce</text>
    <text x="800" y="566" font-size="20" text-anchor="middle" fill="#FBF4EA">engine</text>

    <!-- Payments -->
    <g filter="url(#sh)"><rect x="1040" y="220" width="450" height="160" rx="20" fill="#F4EADD"/></g>
    <text x="1076" y="270" font-size="18" fill="#7B6A66" letter-spacing="2">PAYMENTS</text>
    <g font-size="22" text-anchor="middle">
      <rect x="1076" y="296" width="80" height="50" rx="12" fill="#2A1B30"/><text x="1116" y="329" fill="#FBF4EA">₹</text>
      <rect x="1170" y="296" width="80" height="50" rx="12" fill="#2A1B30"/><text x="1210" y="329" fill="#FBF4EA">$</text>
      <rect x="1264" y="296" width="80" height="50" rx="12" fill="#2A1B30"/><text x="1304" y="329" fill="#FBF4EA">€</text>
      <rect x="1358" y="296" width="96" height="50" rx="12" fill="#F2464B"/><text x="1406" y="329" fill="#FBF4EA" font-size="18">AED</text>
    </g>

    <!-- Orders -->
    <g filter="url(#sh)"><rect x="1040" y="420" width="450" height="160" rx="20" fill="#FBF4EA"/></g>
    <text x="1076" y="470" font-size="18" fill="#7B6A66" letter-spacing="2">ORDERS</text>
    <rect x="1076" y="494" width="380" height="16" rx="8" fill="#F4EADD"/>
    <rect x="1076" y="494" width="260" height="16" rx="8" fill="#2A1B30"/>
    <rect x="1076" y="526" width="380" height="16" rx="8" fill="#F4EADD"/>
    <rect x="1076" y="526" width="170" height="16" rx="8" fill="#F2464B"/>

    <!-- Fulfilment -->
    <g filter="url(#sh)"><rect x="1040" y="620" width="450" height="160" rx="20" fill="#2A1B30"/></g>
    <text x="1076" y="670" font-size="18" fill="#D7A6C2" letter-spacing="2">FULFILMENT</text>
    <g fill="#D7A6C2"><circle cx="1090" cy="720" r="10"/><circle cx="1210" cy="720" r="10"/><circle cx="1330" cy="720" r="10"/></g>
    <circle cx="1450" cy="720" r="12" fill="#FFB33F"/>
    <line x1="1100" y1="720" x2="1438" y2="720" stroke="#4A2C55" stroke-width="3" stroke-dasharray="8 8"/>

    <!-- Confidential badge -->
    <g filter="url(#sh)"><rect x="560" y="110" width="480" height="84" rx="42" fill="#FBF4EA"/></g>
    <rect x="598" y="136" width="26" height="22" rx="4" fill="#2A1B30"/>
    <path d="M603 136 v-6 a8 8 0 0 1 16 0 v6" fill="none" stroke="#2A1B30" stroke-width="3.5"/>
    <text x="642" y="160" font-size="22" fill="#1A1218">Confidential build · details under NDA</text>
  </g>
</svg>
