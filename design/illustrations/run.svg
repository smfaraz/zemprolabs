    <g filter="url(#sh)"><rect x="1060" y="110" width="430" height="420" rx="22" fill="#FBF4EA"/></g>
    <text x="1100" y="168" font-size="20" fill="#7B6A66" letter-spacing="2">PLATFORM HEALTH</text>
    <circle cx="1275" cy="340" r="110" fill="none" stroke="#F4EADD" stroke-width="26"/>
    <circle cx="1275" cy="340" r="110" fill="none" stroke="#2A1B30" stroke-width="26" stroke-dasharray="600 691" transform="rotate(-90 1275 340)" stroke-linecap="round"/>
    <circle cx="1275" cy="340" r="110" fill="none" stroke="#F2464B" stroke-width="26" stroke-dasharray="40 691" stroke-dashoffset="-620" transform="rotate(-90 1275 340)" stroke-linecap="round"/>
    <text x="1275" y="335" font-size="34" text-anchor="middle" fill="#1A1218" font-family="Georgia, serif">Healthy</text>
    <text x="1275" y="368" font-size="17" text-anchor="middle" fill="#7B6A66">CMDB in sync</text>
