    <g>
      <rect x="150" y="664" width="680" height="60" rx="12" fill="#150E16"/>
      <circle cx="180" cy="694" r="8" fill="#F2464B"/>
      <rect x="204" y="687" width="260" height="12" rx="6" fill="#FBF4EA"/>
      <rect x="690" y="680" width="116" height="28" rx="14" fill="#F2464B"/>
      <text x="748" y="700" font-size="16" text-anchor="middle" fill="#FBF4EA">In review</text>

      <rect x="150" y="736" width="680" height="60" rx="12" fill="#150E16"/>
      <circle cx="180" cy="766" r="8" fill="#D7A6C2"/>
      <rect x="204" y="759" width="320" height="12" rx="6" fill="#D7A6C2"/>
      <rect x="690" y="752" width="116" height="28" rx="14" fill="#4A2C55"/>
      <text x="748" y="772" font-size="16" text-anchor="middle" fill="#FBF4EA">Resolved</text>

      <rect x="150" y="808" width="680" height="60" rx="12" fill="#150E16"/>
      <circle cx="180" cy="838" r="8" fill="#D7A6C2"/>
      <rect x="204" y="831" width="210" height="12" rx="6" fill="#D7A6C2"/>
      <rect x="690" y="824" width="116" height="28" rx="14" fill="#4A2C55"/>
      <text x="748" y="844" font-size="16" text-anchor="middle" fill="#FBF4EA">Resolved</text>
    </g>

    <!-- Release timeline -->
    <g filter="url(#sh)"><rect x="920" y="580" width="570" height="330" rx="22" fill="#F4EADD"/></g>
    <text x="960" y="636" font-size="20" fill="#7B6A66" letter-spacing="2">RELEASES</text>
    <line x1="960" y1="870" x2="1450" y2="870" stroke="#E3D2C0" stroke-width="2"/>
    <rect x="960" y="672" width="220" height="30" rx="15" fill="#2A1B30"/>
    <rect x="1060" y="722" width="260" height="30" rx="15" fill="#4A2C55"/>
    <rect x="1180" y="772" width="200" height="30" rx="15" fill="#F2464B"/>
    <rect x="1300" y="822" width="120" height="30" rx="15" fill="#D7A6C2"/>
    <line x1="1240" y1="660" x2="1240" y2="870" stroke="#F2464B" stroke-width="2" stroke-dasharray="6 6"/>
    <circle cx="1240" cy="660" r="7" fill="#F2464B"/>
    <text x="960" y="895" font-size="15" fill="#7B6A66">Dev</text>
    <text x="1180" y="895" font-size="15" fill="#7B6A66">Test</text>
    <text x="1410" y="895" font-size="15" fill="#7B6A66">Prod</text>
  </g>
</svg>
